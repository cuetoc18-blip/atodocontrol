[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/og/:id.jpg"
  to = "/.netlify/functions/og?id=:id"
  status = 200
  force = true
  
[[redirects]]
  from = "/articulo.html"
  to = "/noticia/:id"
  status = 302
  query = {id = ":id"}

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
