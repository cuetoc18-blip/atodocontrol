<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convertidor HLS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background: #c1121f; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .5; }
    #log { background: #111; color: #0f0; padding: 12px; font-family: monospace; font-size: 12px; height: 220px; overflow: auto; white-space: pre-wrap; }
    a.download { display: inline-block; margin: 6px 6px 0 0; color: #c1121f; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Convertidor de video a HLS</h1>
  <p>Elige un video. Te entrega el <code>index.m3u8</code> y los segmentos <code>.ts</code> listos para subir.</p>

  <input type="file" id="video" accept="video/*" />
  <button id="btn" disabled>Convertir</button>

  <div id="log">Esperando video...</div>
  <div id="downloads"></div>

  <script type="module">
    const logEl = document.getElementById('log');
    const downloads = document.getElementById('downloads');
    const btn = document.getElementById('btn');

    function log(msg) {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('video').onchange = () => {
      btn.disabled = false;
      log('Video seleccionado. Pulsa Convertir.');
    };

    let ffmpeg;
    async function loadFFmpeg() {
      if (ffmpeg) return;
      log('Cargando ffmpeg...');
      const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
      const { toBlobURL } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
      ffmpeg = new FFmpeg();
      const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
      await ffmpeg.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
      });
      log('ffmpeg listo');
    }

    btn.onclick = async () => {
      const file = document.getElementById('video').files[0];
      if (!file) return;
      btn.disabled = true;
      downloads.innerHTML = '';
      logEl.textContent = '';

      try {
        await loadFFmpeg();
        log('Leyendo video...');
        const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
        await ffmpeg.writeFile('input.mp4', await fetchFile(file));

        log('Convirtiendo a HLS...');
        await ffmpeg.exec([
          '-i', 'input.mp4',
          '-c:v', 'libx264', '-c:a', 'aac',
          '-hls_time', '4',
          '-hls_playlist_type', 'vod',
          '-hls_segment_filename', 'seg_%03d.ts',
          '-f', 'hls', 'index.m3u8'
        ]);

        log('Listo. Descargando archivos...');
        const files = await ffmpeg.listDir('.');
        for (const f of files) {
          if (!f.name.endsWith('.ts') && f.name !== 'index.m3u8') continue;
          const data = await ffmpeg.readFile(f.name);
          const blob = new Blob([data.buffer], {
            type: f.name.endsWith('.m3u8') ? 'application/vnd.apple.mpegurl' : 'video/mp2t'
          });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = f.name;
          a.textContent = f.name;
          a.className = 'download';
          downloads.appendChild(a);
          a.click();
        }
        log('Archivos descargados. Sube la carpeta completa desde el panel.');
      } catch (e) {
        log('Error: ' + e.message);
      }
      btn.disabled = false;
    };
  </script>
</body>
</html>
